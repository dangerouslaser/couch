name: Build installer binaries
on:
  push:
    paths: ['tools/installer/tui/**', '.github/workflows/installer-binaries.yml']
  pull_request:
    paths: ['tools/installer/tui/**', '.github/workflows/installer-binaries.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-x64, extension: ''}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64, extension: ''}
          - {os: macos-15, target: aarch64-apple-darwin, platform: macos-arm64, extension: ''}
          - {os: macos-15, target: x86_64-apple-darwin, platform: macos-x64, extension: ''}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, platform: windows-x64, extension: '.exe'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/installer/tui
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Test host UI and protocol
        run: cargo test --locked
      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: couch-installer-tui-${{ matrix.platform }}
          path: tools/installer/tui/target/${{ matrix.target }}/release/couch-installer-tui${{ matrix.extension }}
          if-no-files-found: error
  macos-universal:
    needs: native
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: couch-installer-tui-macos-*
          path: binaries
      - name: Combine Intel and Apple Silicon
        run: |
          mkdir -p universal
          lipo -create binaries/couch-installer-tui-macos-x64/couch-installer-tui binaries/couch-installer-tui-macos-arm64/couch-installer-tui -output universal/couch-installer-tui
          chmod +x universal/couch-installer-tui
          lipo universal/couch-installer-tui -verify_arch x86_64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: couch-installer-tui-macos-universal
          path: universal/couch-installer-tui
          if-no-files-found: error
