name: Publish Couch site
on:
  push:
    branches: [main]
    paths: ['site/**', 'preview/**', 'ui/couch-gui/ui/**', 'ui/couch-gui/fonts/**', 'ui/couch-gui/assets/**', 'assets/lucide/**', 'docs/mockups/kodi-activity/assets/**', 'tools/build-preview.sh', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust browser target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.98.1
      - name: Install font build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            preview/target
          key: ${{ runner.os }}-couch-preview-rust-1.98.1-${{ hashFiles('preview/Cargo.lock') }}
      - name: Install matching WASM binding generator
        run: |
          if ! command -v wasm-bindgen >/dev/null || [ "$(wasm-bindgen --version)" != 'wasm-bindgen 0.2.127' ]; then
            cargo install wasm-bindgen-cli --version 0.2.127 --locked --force
          fi
      - name: Build actual Slint remote preview
        run: tools/build-preview.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
