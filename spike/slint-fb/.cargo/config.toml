# macOS "cc" is Apple clang, whose ld rejects every GNU flag rustc passes for
# this target (--as-needed, -Bstatic, --gc-sections...). rust-lld ships with the
# toolchain and links these static musl binaries with no cross-gcc and no Docker.
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
