[package]
name = "slint-fb-spike"
version = "0.1.0"
edition = "2021"

# No backend: this kernel has no X11, no Wayland and no DRM/KMS, so Slint's
# stock Linux backends cannot run. We supply our own Platform and drive the
# software renderer straight into /dev/fb0, which is the same shape as
# couch-gui's flush_cb.
[dependencies]
# Deliberately without Slint's "std" feature. That feature turns on system font
# discovery, which drags in yeslogic-fontconfig-sys - a C library needing a
# cross sysroot and pkg-config, for a device with no font system at all. This is
# the configuration Slint's microcontroller targets use: fonts are embedded at
# build time by build.rs. Our own crate still uses Rust std normally.
slint = { version = "1.17", default-features = false, features = [
    "compat-1-2", "renderer-software", "libm", "unsafe-single-threaded",
] }
libc = "0.2"

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
