[package]
name = "couch-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The contract a Couch integration client implements: settings, capabilities, commands, status and a hardware-free test harness"

# Three dependencies, and the first is the point of the crate.
#
# couch-model because the vocabulary a client answers to is already defined
# there - `commands::Function`, `buttons::functions` and `Integration` - and an
# SDK that invented a second one would be a parallel API the rest of the
# repository does not speak. It is no_std + alloc + serde, so it costs a client
# nothing it was not already going to link through the daemon or the GUI.
#
# serde/serde_json because every client already persists its credentials as
# JSON in a private per-connection file, and the atomic 0600 write that makes
# that safe is currently copied into five clients by hand.
#
# Nothing here opens a socket on a client's behalf: transports stay in the
# client crate, which is what keeps couch-ir's libc-only and couch-kodi's
# dependency-free builds possible.
[dependencies]
couch-model = { path = "../../model/couch-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Off by default: `testing` links a TCP fake host and a conformance harness that
# a shipped client binary has no reason to contain. Enable it in dev-dependencies.
default = []
testing = []
