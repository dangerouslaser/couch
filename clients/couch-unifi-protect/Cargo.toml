[package]
name = "couch-unifi-protect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only UniFi Protect camera, snapshot and RTSPS discovery for Couch"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.4.1", default-features = false, features = ["rustls"] }
url = "2"
zeroize = "1"

sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
rcgen = "0.13"
