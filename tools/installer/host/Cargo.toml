[package]
name = "couch-installer-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
anyhow = "1"
brotli = "8"
ext4-view = { version = "=0.9.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
