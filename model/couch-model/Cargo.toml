[package]
name = "couch-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Couch home configuration: areas, rooms, devices, scenes, activities"

# Its own tiny workspace rather than a member of daemon/ or web/. This crate is
# the one thing both of those - and eventually couch-gui - share, and it has to
# build for three targets that otherwise have nothing in common
# (armv7 musl, wasm32, and the host). Owning it from either side would make one
# consumer's lockfile the other's problem, which is exactly the split the
# clients/ and ui/ workspaces already draw.
[lib]
name = "couch_model"

# no_std + alloc, not because anything here needs to run on a microcontroller,
# but because it costs nothing: the crate is types, Vec and String. Staying off
# std means the wasm build has no reason to pull one in, and leaves the door
# open if a future firmware-side consumer wants it.
[dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

[features]
default = ["std"]
std = ["serde/std"]
